<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyecto Bobina de Tesla · Feria científica</title>
<meta name="theme-color" content="#06041a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06041a; --violet:#7b5cff; --ice:#bfeaff; --white:#ffffff; --muted:#a9a6d6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 28%,#1a1250 0%,var(--bg) 60%);
  color:var(--white); font-family:var(--body); overflow:hidden;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;z-index:1}
.coil{height:min(40vh,320px);width:auto;filter:drop-shadow(0 0 24px rgba(123,92,255,.55))}
footer{
  position:relative;z-index:2;text-align:center;
  padding:1.5rem 1.25rem 1.75rem;
  background:linear-gradient(to top,rgba(6,4,26,.92) 55%,rgba(6,4,26,0));
}
.evento{font-size:clamp(1rem,3.4vw,1.25rem);color:var(--ice);font-weight:600;letter-spacing:.02em}
h1{
  font-family:var(--display);font-weight:800;line-height:1.05;
  font-size:clamp(1.9rem,7.5vw,3.9rem);margin:.4rem 0 1rem;
  text-shadow:0 0 18px rgba(123,92,255,.9),0 0 48px rgba(123,92,255,.5);
}
.datos{font-size:clamp(1rem,3.4vw,1.2rem);line-height:1.6}
.datos strong{font-weight:600}
.datos span{display:block;color:var(--muted)}
.hint{margin-top:1rem;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.coil{filter:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="stage">
  <svg class="coil" viewBox="0 0 120 300" role="img" aria-label="Bobina de Tesla">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5b4ad6"/><stop offset=".5" stop-color="#d9ccff"/><stop offset="1" stop-color="#5b4ad6"/>
      </linearGradient>
      <pattern id="wind" width="36" height="4" patternUnits="userSpaceOnUse">
        <rect width="36" height="2.4" fill="#e8b27a"/><rect y="2.4" width="36" height="1.6" fill="#7a4a22"/>
      </pattern>
    </defs>
    <rect x="18" y="268" width="84" height="22" rx="5" fill="#1d1650" stroke="#7b5cff" stroke-width="1.5"/>
    <rect x="40" y="76" width="40" height="192" rx="4" fill="url(#wind)"/>
    <rect x="40" y="76" width="40" height="192" rx="4" fill="none" stroke="#7b5cff" stroke-opacity=".6"/>
    <rect x="30" y="228" width="60" height="28" rx="3" fill="none" stroke="#bfeaff" stroke-width="3" stroke-dasharray="6 3"/>
    <ellipse id="toroid" cx="60" cy="56" rx="50" ry="17" fill="url(#metal)"/>
    <ellipse cx="60" cy="56" rx="22" ry="6" fill="#06041a" opacity=".55"/>
  </svg>
</main>

<footer>
  <p class="evento">Feria científica</p>
  <h1>Proyecto Bobina de Tesla</h1>
  <p class="datos">
    <strong>Alumno: Felipe Melendez Burgos</strong>
    <span>Primero Medio B</span>
    <span>Colegio Chilean Eagles College SEG</span>
  </p>
  <p class="hint">Toca la pantalla para lanzar un rayo</p>
</footer>

<script>
(function(){
  var c=document.getElementById('fx'),ctx=c.getContext('2d');
  var W,H,bolts=[],reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    if(reduce)staticFrame();
  }
  function origin(){
    var r=document.getElementById('toroid').getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height*0.35};
  }
  function jag(x1,y1,x2,y2,d,out){
    if(d<3){out.push([x2,y2]);return;}
    var mx=(x1+x2)/2+(Math.random()-.5)*d,my=(y1+y2)/2+(Math.random()-.5)*d;
    jag(x1,y1,mx,my,d/2,out);jag(mx,my,x2,y2,d/2,out);
  }
  function makeBolt(x1,y1,x2,y2){
    var len=Math.hypot(x2-x1,y2-y1),main=[[x1,y1]];
    jag(x1,y1,x2,y2,len*0.35,main);
    var paths=[main];
    for(var i=3;i<main.length-2;i++){
      if(Math.random()<0.07){
        var p=main[i],a=Math.atan2(y2-y1,x2-x1)+(Math.random()-.5)*1.6,l=len*(0.12+Math.random()*0.22);
        var br=[[p[0],p[1]]];
        jag(p[0],p[1],p[0]+Math.cos(a)*l,p[1]+Math.sin(a)*l,l*0.4,br);
        paths.push(br);
      }
    }
    return paths;
  }
  function strike(tx,ty){
    var o=origin();
    if(tx==null){
      var ang=Math.random()*Math.PI*2,r=Math.max(W,H)*(0.25+Math.random()*0.4);
      tx=o.x+Math.cos(ang)*r;ty=o.y+Math.sin(ang)*r*0.8;
      ty=Math.min(ty,H*0.55);
      tx=Math.max(10,Math.min(W-10,tx));ty=Math.max(10,ty);
    }
    bolts.push({paths:makeBolt(o.x,o.y,tx,ty),born:performance.now(),life:reduce?Infinity:170+Math.random()*150});
  }
  function drawPaths(paths,alpha){
    ctx.lineJoin='round';ctx.lineCap='round';
    function pass(w,col,blur){
      ctx.lineWidth=w;ctx.strokeStyle=col;ctx.shadowColor='#7b5cff';ctx.shadowBlur=blur;
      paths.forEach(function(p,idx){
        ctx.globalAlpha=alpha*(idx?0.7:1);
        ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
        for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
        ctx.stroke();
      });
    }
    pass(5,'rgba(123,92,255,.55)',26);
    pass(1.6,'#e9f7ff',10);
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
  function frame(now){
    ctx.clearRect(0,0,W,H);
    bolts=bolts.filter(function(b){return now-b.born<b.life;});
    bolts.forEach(function(b){
      var t=(now-b.born)/b.life,a=(1-t)*(Math.random()>0.22?1:0.45);
      drawPaths(b.paths,a);
    });
    requestAnimationFrame(frame);
  }
  function staticFrame(){
    bolts=[];for(var i=0;i<4;i++)strike();
    ctx.clearRect(0,0,W,H);
    bolts.forEach(function(b){drawPaths(b.paths,.85);});
  }
  function schedule(){
    strike();
    if(Math.random()<0.35)setTimeout(strike,60);
    setTimeout(schedule,350+Math.random()*900);
  }

  window.addEventListener('resize',resize);
  resize();
  if(!reduce){
    var last=0;
    window.addEventListener('pointerdown',function(e){strike(e.clientX,e.clientY);});
    window.addEventListener('pointermove',function(e){
      if(e.pointerType!=='mouse')return;
      var n=performance.now();if(n-last<110)return;last=n;strike(e.clientX,e.clientY);
    });
    requestAnimationFrame(frame);
    schedule();
  }
})();
</script>
</body>
</html>
